<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1125 550" role="img" aria-labelledby="title desc">
  <title id="title">GoldRush2 系统总览</title>
  <desc id="desc">规则与回放支持对局可视化、机制建模和模拟器实现，随后完成策略训练与部署。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
    <marker id="shared-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif; fill: #f0f6fc; font-size: 18px; }
      .panel { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
      .panel-title { fill: #8b949e; font-size: 17px; font-weight: 600; }
      .node { fill: #21262d; stroke: #8b949e; stroke-width: 1.5; }
      .model { fill: #0c2d6b; stroke: #388bfd; }
      .train { fill: #3d2f00; stroke: #d29922; }
      .deploy { fill: #033a16; stroke: #3fb950; }
      .edge { fill: none; stroke: #8b949e; stroke-width: 2; marker-end: url(#arrow); }
      .shared-edge { fill: none; stroke: #3fb950; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#shared-arrow); }
    </style>
  </defs>

  <rect class="panel" x="15" y="15" width="675" height="240" rx="14"/>
  <text class="panel-title" x="35" y="43">环境与机制建模</text>

  <rect class="node" x="35" y="153" width="180" height="54" rx="8"/>
  <text x="125" y="186" text-anchor="middle">官方规则与对局回放</text>

  <rect class="node model" x="260" y="55" width="180" height="50" rx="8"/>
  <text x="350" y="86" text-anchor="middle">对局可视化器</text>

  <rect class="node model" x="260" y="120" width="180" height="50" rx="8"/>
  <text x="350" y="151" text-anchor="middle">隐藏机制观测与拟合</text>

  <rect class="node model" x="260" y="185" width="180" height="50" rx="8"/>
  <text x="350" y="216" text-anchor="middle">确定性规则实现</text>

  <rect class="node model" x="485" y="120" width="180" height="50" rx="8"/>
  <text x="575" y="151" text-anchor="middle">可替换的机制近似</text>

  <rect class="node model" x="485" y="185" width="180" height="50" rx="8"/>
  <text x="575" y="216" text-anchor="middle">本地模拟器</text>

  <path class="edge" d="M 215 180 H 235 V 80 H 260"/>
  <path class="edge" d="M 215 180 H 235 V 145 H 260"/>
  <path class="edge" d="M 215 180 H 235 V 210 H 260"/>
  <path class="edge" d="M 440 145 H 485"/>
  <path class="edge" d="M 440 210 H 485"/>
  <path class="edge" d="M 575 170 V 185"/>

  <rect class="panel" x="15" y="275" width="1095" height="260" rx="14"/>
  <text class="panel-title" x="35" y="305">策略训练与部署</text>

  <rect class="node train" x="30" y="330" width="150" height="54" rx="8"/>
  <text x="105" y="363" text-anchor="middle">快速规则策略</text>

  <rect class="node train" x="210" y="330" width="160" height="54" rx="8"/>
  <text x="290" y="363" text-anchor="middle">BC / PPO 训练</text>

  <rect class="node train" x="400" y="330" width="165" height="54" rx="8"/>
  <text x="482.5" y="363" text-anchor="middle">策略 checkpoint</text>

  <rect class="node deploy" x="595" y="330" width="160" height="54" rx="8"/>
  <text x="675" y="363" text-anchor="middle">Actor-only ONNX</text>

  <rect class="node deploy" x="785" y="330" width="145" height="54" rx="8"/>
  <text x="857.5" y="363" text-anchor="middle">C++ runtime</text>

  <rect class="node deploy" x="960" y="330" width="130" height="54" rx="8"/>
  <text x="1025" y="363" text-anchor="middle">平台提交</text>

  <path class="edge" d="M 180 357 H 210"/>
  <path class="edge" d="M 370 357 H 400"/>
  <path class="edge" d="M 565 357 H 595"/>
  <path class="edge" d="M 755 357 H 785"/>
  <path class="edge" d="M 930 357 H 960"/>

  <path class="edge" d="M 575 235 V 285 H 290 V 330"/>

  <rect class="node deploy" x="465" y="445" width="200" height="54" rx="8"/>
  <text x="565" y="478" text-anchor="middle">可部署特征提取器</text>

  <path class="shared-edge" d="M 465 472 H 290 V 384"/>
  <path class="shared-edge" d="M 665 472 H 857.5 V 384"/>
</svg>
